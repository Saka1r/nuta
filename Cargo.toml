[package]
name = "nuta"
version = "0.1.0"
edition = "2024"
authors = ["Saka1r"]
description = "Nimble Unix Text Architect"

[dependencies]
crossterm = "0.29.0"
dirs = "7.0.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
unicode-width = "0.1"
url = "2.5.8"

[profile.release]
opt-level = 3
lto = true
strip = true
