name = "Assembly"
extensions = ["asm", "s", "nasm"]

[[rule]]
regex = ';.*$'
group = "Comment"

[[rule]]
regex = '#.*$'
group = "Comment"

[[rule]]
regex = '//.*$'
group = "Comment"

[[rule]]
regex = '"[^"]*"'
group = "String"

[[rule]]
regex = "'[^']*'"
group = "String"

[[rule]]
regex = '^\s*\.[A-Za-z0-9_]+'
group = "PreProc"

[[rule]]
regex = '^\s*[A-Za-z_.$][A-Za-z0-9_.$]*:'
group = "Label"

[[rule]]
regex = '\b(0x[0-9a-fA-F]+|[0-9]+)\b'
group = "Number"

[[rule]]
regex = '\b(rax|rbx|rcx|rdx|rsi|rdi|rsp|rbp|r8|r9|r10|r11|r12|r13|r14|r15|eax|ebx|ecx|edx|esi|edi|esp|ebp|ax|bx|cx|dx|al|bl|cl|dl|ah|bh|ch|dh|xmm0|xmm1|xmm2|xmm3|xmm4|xmm5|xmm6|xmm7)\b'
group = "Register"

[[rule]]
regex = '\b(mov|add|sub|mul|div|imul|idiv|inc|dec|neg|and|or|xor|not|shl|shr|sar|sal|cmp|test|jmp|je|jne|jz|jnz|jg|jge|jl|jle|ja|jae|jb|jbe|call|ret|push|pop|lea|enter|leave|syscall|int|nop|cdq|cwd|movzx|movsx)\b'
group = "Keyword"
